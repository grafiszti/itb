[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itb"
version = "0.1.2"
description = "Toolbox library for rapid prototyping of computer vision projects."
readme = "README.md"
authors = [{ name = "Mateusz Choiński", email = "mateusz.choinski100@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["images", "toolbox", "computer vision", "opencv", "matplotlib", "jupyter"]
dependencies = [
    "matplotlib>=3.8.2",
    "opencv-python>=4.8.1.78",
    "pandas>=2.1.3",
    "requests>=2.32.3",
]
requires-python = ">=3.10"

[project.optional-dependencies]
# package development requirements
dev = [
    "black==26.1.0",
    "build==1.4.0",
    "flake8-pyproject==1.2.4",
    "isort==8.0.0",
    "jupyter==1.1.1",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "setuptools==82.0.0",
    "twine==6.2.0",
    "virtualenv==21.0.0",
]

[project.urls]
Homepage = "https://github.com/grafiszti/itb"

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
max-complexity = 10
extend-ignore = ["E41", "E203", "E226", "E302", "E501", 'W503', 'W605']
